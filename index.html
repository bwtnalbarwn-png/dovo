<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HAMZAWI STORE - اطلب الآن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e21b79; /* بينك البراند الأنيق */
            --secondary-color: #d60000; /* أحمر ناري قوي */
            --bg-color: #eff1f5; /* لون رصاصي خفيف جداً للصفحة */
            --card-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes carpetRoll {
            0%, 100% { width: 0; opacity: 0; padding: 0; }
            10%, 40% { width: 130px; opacity: 1; padding: 0 15px 0 35px; }
            50%, 90% { width: 0; opacity: 0; padding: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #222;
            padding-bottom: 120px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }
        
        .images-gallery {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-img-full {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: -1px;
        }
        
        .animated-card {
            background: #fff;
            border-radius: 20px;
            margin: 20px;
            padding: 25px 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.03);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }
        .card-1 { animation-delay: 0.1s; }
        .card-2 { animation-delay: 0.3s; }
        .card-3 { animation-delay: 0.5s; }

        h2.main-title {
            font-size: 24px;
            color: #111;
            margin: 0 0 12px 0;
            text-align: center;
            font-weight: 900;
        }
        .sub-title {
            font-size: 15px;
            color: #555;
            text-align: center;
            margin-bottom: 0;
            line-height: 1.7;
            font-weight: 600;
        }
        
        .price-container {
            margin-top: 20px;
            text-align: center;
            background: #fff0f6;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--primary-color);
        }
        .old-price {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
            margin-left: 8px;
            font-weight: 600;
        }
        .new-price {
            font-size: 28px;
            color: var(--primary-color);
            font-weight: 900;
        }
        
        .offers-title, .form-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            color: #111;
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
        }
