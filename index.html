<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HAMZAWI STORE - اطلب الآن</title>
    <style>
        :root {
            --primary-color: #e21b79; /* لون البراند البينك الأنيق */
            --secondary-color: #d60000; /* أحمر ناري قوي لزرار تأكيد الطلب */
            --bg-color: #f7f7f7;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
            padding-bottom: 95px; /* مساحة للزرار العائم السفلي */
        }
        .header-marquee {
            background-color: #ffef00; /* أصفر فاقع بيشد العين */
            color: #d60000; /* أحمر ناري واضح */
            font-weight: bold;
            font-size: 14px;
            padding: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 14s linear infinite;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .content-padding {
            padding: 20px;
        }
        .product-img-full {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: -2px; /* منع الفراغات بين الصور */
        }
        h2.main-title {
            font-size: 24px;
            color: #111;
            margin: 20px 0 8px 0;
            text-align: center;
            font-weight: bold;
        }
        .sub-title {
            font-size: 15px;
            color: #555;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
            padding: 0 10px;
        }
        .price-container {
            font-size: 30px;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        
        /* قسم العروض المطور */
        .offers-section {
            background-color: #fcfcfc;
            padding: 25px 20px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .offers-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #111;
        }
        .offer-box {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .offer-box input {
            margin-left: 14px;
            transform: scale(1.4);
        }
        .offer-box.selected {
            border-color: var(--primary-color);
            background-color: #fff0f6;
            box-shadow: 0 4px 10px rgba(226, 27, 121, 0.1);
        }
        
        /* شارة الأكثر مبيعاً المخصصة على عرض الـ 3 عبوات */
        .best-seller-badge {
            position: absolute;
            top: -14px;
            left: 20px;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(255, 87, 34, 0.3);
        }

        .form-section {
            background-color: #fff;
            padding: 30px 20px;
            border-top: 4px solid #f0f0f0;
        }
        .form-title {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            color: #111;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: #444;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            background-color: #fafafa;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 5px rgba(226, 27, 121, 0.1);
        }
        
        /* زر الشراء العائم الناري والسريع للطلب المباشر */
        .order-now-btn {
            background: linear-gradient(90deg, #d60000, #ff1a1a);
            color: white;
            border: none;
            width: calc(100% - 30px);
            max-width: 470px;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(214, 0, 0, 0.4);
            transition: 0.3s;
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

            box-shadow: 0 8px 25px rgba(214
