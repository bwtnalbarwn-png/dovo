<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HAMZAWI STORE - اطلب الآن</title>
    <style>
        :root {
            --primary-color: #e21b79; /* اللون البينك الاحترافي */
            --secondary-color: #25d366; /* لون الواتساب الأخضر */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .product-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
        }
        h2 {
            font-size: 24px;
            color: #111;
            margin-bottom: 5px;
            text-align: center;
        }
        .sub-title {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
        .price-tag {
            font-size: 26px;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }
        .offer-box {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .offer-box input {
            margin-left: 12px;
            transform: scale(1.2);
        }
        .offer-box.selected {
            border-color: var(--primary-color);
            background-color: #fff0f6;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 15px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
        }
        .submit-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
            margin-top: 25px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.ibb.co/6w4g7k4/DOVO-Natural-Breast-Lift.jpg" alt="كريم DOVO الطبيعي" class="product-img">
    
    <h2>كريم DOVO الطبيعي الأصلي</h2>
    <div class="sub-title">العناية المتكاملة لمظهر أكثر أنوثة وثقة</div>
    <div class="price-tag">275 ج.م</div>

    <h3>اختر العرض المناسب:</h3>
    <div class="offer-box selected" onclick="selectOffer(this, 'عبوة واحدة بسعر 275 ج.م')">
        <input type="radio" name="offer" checked>
        <div>اشتري عبوة واحدة الآن بسعر 275 جنيه فقط</div>
    </div>
    <div class="offer-box" onclick="selectOffer(this, 'عرض العبوتين بسعر 500 ج.م')">
        <input type="radio" name="offer">
        <div>عرض العبوتين بسعر 500 ج.م فقط 🌟</div>
    </div>
    <div class="offer-box" onclick="selectOffer(this, '3 عبوات بسعر 720 ج.م')">
        <input type="radio" name="offer">
        <div>اشتري 3 عبوات بسعر 720 ج.م فقط 🔥</div>
    </div>

    <h3 style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">يرجى إدخال معلوماتك لإكمال الطلب:</h3>
    <div class="form-group">
        <label>الاسم بالكامل</label>
        <input type="text" id="name" placeholder="اكتب اسمك هنا">
    </div>
    <div class="form-group">
        <label>رقم الهاتف (يفضل عليه واتساب)</label>
        <input type="tel" id="phone" placeholder="رقم الموبايل مكون من 11 رقم">
    </div>
    <div class="form-group">
        <label>المحافظة</label>
        <select id="governorate">
            <option value="">اختر المحافظة</option>
            <option value="القاهرة">القاهرة</option>
            <option value="الجيزة">الجيزة</option>
            <option value="الإسكندرية">الإسكندرية</option>
            <option value="القليوبية">القليوبية</option>
            <option value="المنوفية">المنوفية</option>
            <option value="الشرقية">الشرقية</option>
            <option value="الغربية">الغربية</option>
            <option value="الدقهلية">الدقهلية</option>
            <option value="البحيرة">البحيرة</option>
            <option value="دمياط">دمياط</option>
            <option value="بورسعيد">بورسعيد</option>
            <option value="الإسماعيلية">الإسماعيلية</option>
            <option value="السويس">السويس</option>
            <option value="الفيوم">الفيوم</option>
            <option value="بني سويف">بني سويف</option>
            <option value="المنيا">المنيا</option>
            <option value="أسيوط">أسيوط</option>
            <option value="سوهاج">سوهاج</option>
            <option value="قنا">قنا</option>
            <option value="الأقصر">الأقصر</option>
            <option value="أسوان">أسوان</option>
            <option value="مطروح">مطروح</option>
            <option value="الوادي الجديد">الوادي الجديد</option>
            <option value="البحر الأحمر">البحر الأحمر</option>
            <option value="شمال سيناء">شمال سيناء</option>
            <option value="جنوب سيناء">جنوب سيناء</option>
        </select>
    </div>
    <div class="form-group">
        <label>العنوان بالتفصيل</label>
        <input type="text" id="address" placeholder="اسم الشارع، رقم العقار، الدور أو علامة مميزة">
    </div>

    <button class="submit-btn" onclick="sendToWhatsApp()">
        <span>اضغط هنا للشراء عبر الواتساب 💬</span>
    </button>
</div>

<script>
    let chosenOffer = "عبوة واحدة بسعر 275 ج.م";

    function selectOffer(element, offerText) {
        document.querySelectorAll('.offer-box').forEach(box => {
            box.classList.remove('selected');
            box.querySelector('input').checked = false;
        });
        element.classList.add('selected');
        element.querySelector('input').checked = true;
        chosenOffer = offerText;
    }

    function sendToWhatsApp() {
        // تم ربط رقم براندك المباشر بنجاح
        const myWhatsAppNumber = "201207362722"; 

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const gov = document.getElementById('governorate').value;
        const address = document.getElementById('address').value.trim();

        if(!name || !phone || !gov || !address) {
            alert('يا فندم يرجى ملء جميع الخانات أولاً لإكمال طلبك!');
            return;
        }

        // تنسيق الرسالة الاحترافية التي ستصلك فوراً على شات الواتساب عند ضغط العميل
        const message = `🚨 طلب جديد من موقع AL-HAMZAWI 🚨\n\n` +
                        `👤 الاسم بالكامل: ${name}\n` +
                        `📞 رقم الهاتف: ${phone}\n` +
                        `📍 المحافظة: ${gov}\n` +
                        `🏠 العنوان بالتفصيل: ${address}\n` +
                        `🎁 العرض المختار: ${chosenOffer}\n\n` +
                        `رجاء مراجعة الطلب وتأكيد الشحن الفوري سريعاً! 🔥`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodedMessage}`;

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
